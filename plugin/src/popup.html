<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title data-i18n="app_title">Popup</title>
    <link href="./popup.css" rel="stylesheet" />
    <script src="config.js" defer></script>
    <script src="popup.js" defer></script>
  </head>


  <body class="w-[440px] pb-4">
    <header
      class="px-8 py-3 flex justify-between items-center border-b border-grey-100 h-fit"
    >
      <div class="flex gap-2 items-center">
        <img
          src="../assets/images/logo.png"
          alt="GreenScore Logo"
          style="width: 32px; height: 34px"
        />
        <h1 class="text-2xl font-outfit font-extrabold text-gs-green-950" data-i18n="app_title">
          GreenScore Web
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="flex gap-2">
          <button
            id="btn-lang-en"
            class="transition-all duration-300 hover:scale-110 cursor-pointer opacity-50 grayscale hover:grayscale-0 hover:opacity-100"
            title="English"
          >
            <img src="../assets/images/flags/gb.svg" alt="English" style="width: 24px; height: auto;" class="object-cover rounded shadow-sm" />
          </button>
          <button
            id="btn-lang-fr"
            class="transition-all duration-300 hover:scale-110 cursor-pointer opacity-50 grayscale hover:grayscale-0 hover:opacity-100"
            title="Français"
          >
            <img src="../assets/images/flags/fr.svg" alt="Français" style="width: 24px; height: auto;" class="object-cover rounded shadow-sm" />
          </button>
        </div>
      </div>

    </header>
    <div id="main-container">
      <div
        class="flex flex-row font-outfit w-full items-center justify-center p-2"
      >
        <p class="text-grey-400 text-sm" data-i18n="site_current">Site actuel :&nbsp</p>
        <p id="site-url" class="text-grey-400 text-sm font-bold">Chargement...</p>
      </div>

      <div class="flex flex-col gap-6 px-4">
        <div class="flex flex-col items-center justify-center gap-2 w-full">
          <h2
            id="site-country"
            class="text-xl w-2/3 text-center font-extrabold font-outfit text-grey-950"
            data-i18n="site_country_sentence"
          >
            Dans votre pays (*Pays*), cette page consomme
          </h2>
          <div class="flex flex-col justify-center items-center">
            <div
              id="gCO2e-container"
              class="flex items-baseline font-outfit text-[#BD2525]"
            >
              <span id="gCO2e-value" class="text-5xl font-extrabold"
                >0&nbsp;</span
              >
              <div class="flex font-medium gap-0 items-baseline">
                <span class="text-base">gCO</span>
                <span class="text-xs">2</span>
                <span class="text-base">e</span>
              </div>
            </div>
            <div class="flex font-outfit font-light text-base text-grey-950">
              <p id="average-comparison" class="font-bold text-base" data-i18n="average_negligible">négligeable comparé à la moyenne</p>
            </div>
          </div>
        </div>

        <div class="flex flex-col font-outfit gap-2">
          <p class="text-sm font-light" data-i18n="corresponds_to">Cela correspond à :</p>
          <div class="flex gap-3 items-center justify-center">
            <div
              class="comparison-card flex flex-col p-2 w-[120px] h-[120px] gap-2 rounded-[4px]"
            >
              <div class="flex flex-col gap-[6px]">
                <img
                  src="../assets/images/account.svg"
                  class="w-5 h-5 object-cover"
                  alt="equivalent-1"
                />
                <p class="text-xl font-extrabold">0.00</p>
              </div>
              <p class="text-xs" data-i18n="no_data">Pas de données</p>
            </div>
            <div
              class="comparison-card flex flex-col p-2 w-[120px] h-[120px] gap-2 rounded-[4px]"
            >
              <div class="flex flex-col gap-[6px]">
                <img
                  src="../assets/images/account.svg"
                  class="w-5 h-5 object-cover"
                  alt="equivalent-2"
                />
                <p class="text-xl font-extrabold">0.00</p>
              </div>
              <p class="text-xs" data-i18n="no_data">Pas de données</p>
            </div>
            <div
              class="comparison-card flex flex-col p-2 w-[120px] h-[120px] gap-2 rounded-[4px]"
            >
              <div class="flex flex-col gap-[6px]">
                <img
                  src="../assets/images/account.svg"
                  class="w-5 h-5 object-cover"
                  alt="equivalent-3"
                />
                <p class="text-xl font-extrabold">0.00</p>
              </div>
              <p class="text-xs" data-i18n="no_data">Pas de données</p>
            </div>
          </div>
        </div>

        <div class="flex flex-col w-full gap-2">
          <a
            id="details-button"
            href="#"
            class="flex justify-center items-center py-2 text-white font-outfit font-medium bg-gs-green-950 rounded-lg w-full h-fit"
            data-i18n="more_details"
          >
            Plus de détails
          </a>
          <div class="flex font-outfit text-sm justify-center">
            <span class="text-sm text-grey-950" data-i18n="save_prompt"
              >Vous souhaitez enregistrer ce résultat ?&nbsp;</span
            >
            <a href="#" class="text-[#6D874B] font-bold underline" id="login-link" data-i18n="login"
              >Se connecter</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
