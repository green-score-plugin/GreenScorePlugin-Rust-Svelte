[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[features]
default = []
tokio-console = ["dep:console-subscriber"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.8.7"
serde_json = "1.0"
tower-sessions = "0.15.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "macros", "mysql", "sqlite"] }
async-trait = "0.1.89"
dotenvy = "0.15.7"
time = "0.3.44"
bcrypt = "0.19.0"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
serde = { version = "1.0.228", features = ["derive"] }
rand = "0.10.0"
console-subscriber = { version = "0.5.0", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
